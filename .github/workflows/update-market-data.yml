name: Update Official Market Data

on:
  schedule:
    # 每個營業日下午 16:30 台北時間 (UTC 08:30) 自動執行更新
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊執行

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pytz

      - name: Run Export Data Script
        run: |
          python backend/export_data.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): 自動更新官方台股最新收盤行情 [skip ci]" && git push)
